<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HQ Digital Interativa</title>
  <link rel="stylesheet" href="style.css?v=8">
</head>
<body>
  <main id="hq-stage">
    <!-- Imagem principal do quadrinho atual -->
    <img id="panel-img" src="" alt="Quadrinho" draggable="false">

    <!-- Camadas de texto exclusivas da primeira cena (Quad 1) -->
    <div class="comic-text text-eu" aria-hidden="true">Eu</div>
    <div class="comic-text text-te" aria-hidden="true">te</div>
    <div class="comic-text text-vi" aria-hidden="true">vi</div>
    <div class="comic-text text-la" aria-hidden="true">lá</div>

    <!-- Texto "Fim" exclusivo do último quadrinho (trueending) -->
    <div class="comic-text text-fim" id="text-fim" aria-hidden="true">Fim</div>

    <!-- Contêiner dinâmico que recebe os textos das demais cenas via JavaScript -->
    <div id="panel-text" class="comic-text" aria-hidden="true"></div>

    <!-- Elementos dos minigames (Labirinto e Ampulheta) -->
    <div id="sand-layer" aria-hidden="true"></div>
    <div id="maze-player" aria-label="Arraste a bolinha pelo labirinto"></div>

    <!-- Botões de navegação lateral -->
    <div class="nav-zone left hidden" id="btn-prev" aria-label="Quadrinho anterior">
      <div class="arrow">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
        </svg>
      </div>
    </div>
    <div class="nav-zone right" id="btn-next" aria-label="Próximo quadrinho">
      <div class="arrow">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>
        </svg>
      </div>
    </div>

    <!-- Trilhas sonoras da HQ (divididas por capítulos) -->
    <audio id="audio-part1" preload="auto" loop>
      <source src="assets/trilhasonora1a5.mpeg" type="audio/mpeg">
    </audio>
    <audio id="audio-part2" preload="auto" loop>
      <source src="assets/trilhasonora6a11.mpeg" type="audio/mpeg">
    </audio>

    <!-- Indicador textual da página atual -->
    <div id="page-counter"></div>
  </main>

  <!-- Filtro que mapeia Branco (255, 255, 255) exatamente para RGB (224, 224, 192) -->
  <svg style="position: absolute; width: 0; height: 0; pointer-events: none; overflow: hidden;" aria-hidden="true">
    <filter id="tint-quad78" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="
        0.87843 0       0       0 0
        0       0.87843 0       0 0
        0       0       0.75294 0 0
        0       0       0       1 0" />
    </filter>
  </svg>

  <script src="script.js?v=8"></script>
</body>
</html>
