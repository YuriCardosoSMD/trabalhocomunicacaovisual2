<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>HQ Digital Interativa</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main id="hq-stage">

    <!-- =========================================
         IMAGEM DO QUADRINHO
         ========================================= -->

    <img
      id="panel-img"
      src=""
      alt="Quadrinho"
      draggable="false"
    >


    <!-- =========================================
         TEXTOS DO PRIMEIRO QUADRINHO
         ========================================= -->

    <div
      class="comic-text text-eu"
      aria-hidden="true"
    >
      Eu
    </div>

    <div
      class="comic-text text-te"
      aria-hidden="true"
    >
      te
    </div>

    <div
      class="comic-text text-vi"
      aria-hidden="true"
    >
      vi
    </div>

    <div
      class="comic-text text-la"
      aria-hidden="true"
    >
      lá
    </div>


    <!-- =========================================
         TEXTO DOS OUTROS QUADRINHOS
         ========================================= -->

    <div
      id="panel-text"
      class="comic-text"
      aria-hidden="true"
    ></div>


    <!-- =========================================
         JOGADOR DO LABIRINTO
         APARECE SOMENTE NO QUADRINHO 6
         ========================================= -->

    <div
      id="maze-player"
      aria-label="Arraste a bolinha pelo labirinto"
    ></div>


    <!-- =========================================
         BOTÃO / ZONA ESQUERDA
         ========================================= -->

    <div
      class="nav-zone left hidden"
      id="btn-prev"
      aria-label="Quadrinho anterior"
    >

      <div class="arrow">

        <svg
          viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >

          <path
            d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"
          />

        </svg>

      </div>

    </div>


    <!-- =========================================
         BOTÃO / ZONA DIREITA
         ========================================= -->

    <div
      class="nav-zone right"
      id="btn-next"
      aria-label="Próximo quadrinho"
    >

      <div class="arrow">

        <svg
          viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >

          <path
            d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"
          />

        </svg>

      </div>

    </div>


    <!-- =========================================
         CONTADOR
         ========================================= -->

    <div id="page-counter"></div>

  </main>


  <script src="script.js"></script>

</body>

</html>
