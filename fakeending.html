<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fake Ending</title>
  <style>
    @font-face {
      font-family: "Seventeen";
      src: url("assets/fonts/I am Seventeen.ttf") format("truetype"),
           url("assets/fonts/I_am_Seventeen.ttf") format("truetype");
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #1a1008;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      font-family: "Seventeen", sans-serif;
    }
    #fake-stage {
      position: relative;
      /* Ocupa exatamente 90% da tela mantendo a proporção 720 / 500 */
      width: min(90vw, calc(90vh * 720 / 500));
      width: min(90vw, calc(90dvh * 720 / 500));
      max-width: none;
      aspect-ratio: 720 / 500;
      overflow: hidden;
      cursor: pointer;
      container-type: inline-size;
      user-select: none;
    }
    #fake-stage img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }
    .fake-text {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90%;
      text-align: center;
      font-family: "Seventeen", sans-serif;
      font-size: clamp(22px, 4.4cqi, 48px);
      line-height: 1.25;
      color: #111;
      text-shadow: 1px 1px 0 rgba(255, 255, 255, 0.75),
                  -1px -1px 0 rgba(255, 255, 255, 0.75),
                   1px -1px 0 rgba(255, 255, 255, 0.75),
                  -1px  1px 0 rgba(255, 255, 255, 0.75);
      pointer-events: none;
      user-select: none;
      z-index: 10;
    }
  </style>
</head>
<body onclick="window.location.href='index.html'">
  <div id="fake-stage">
    <img src="assets/fakeending.gif" alt="Fake Ending">
    <div class="fake-text">Eu te perdi, mas eu vou tentar de novo</div>
  </div>
</body>
</html>
