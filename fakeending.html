<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fake Ending</title>
  <style>
    @font-face {
      font-family: "Seventeen";
      src: url("assets/fonts/I am Seventeen.ttf") format("truetype");
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #1a1008;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: "Seventeen", sans-serif;
    }

    #fake-stage {
      position: relative;
      width: 80vw;
      max-width: 1200px;
      aspect-ratio: 720 / 500;
      overflow: hidden;
      cursor: pointer;
    }

    #fake-stage img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    @media (max-width: 1024px) {
      #fake-stage {
        width: 95vw;
      }
    }

    @media (max-width: 380px) {
      #fake-stage {
        width: 92vw;
      }
    }
  </style>
</head>
<body onclick="window.location.href='index.html'">
  <div id="fake-stage">
    <img src="assets/fakeending.gif" alt="Fake Ending">
  </div>
</body>
</html>
