<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fake Ending</title>
  <style>
    /* Reset básico */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Fundo igual ao da HQ principal */
    body {
      background-color: #1a1008;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: Georgia, serif;
    }

    /* Container com as mesmas dimensões da #hq-stage */
    #fake-stage {
      position: relative;
      width: 80vw;
      max-width: 1200px;
      aspect-ratio: 720 / 500;
      overflow: hidden;
      cursor: pointer; /* Indica que é clicável */
    }

    /* A imagem preenche o container mantendo a proporção */
    #fake-stage img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none; /* Impede a imagem de capturar o clique */
    }

    /* Responsividade - mesmo comportamento das outras páginas */
    @media (max-width: 1024px) {
      #fake-stage {
        width: 95vw;
      }
    }

    @media (max-width: 380px) {
      #fake-stage {
        width: 92vw;
      }
    }
  </style>
</head>
<body onclick="window.location.href='index.html'">
  <!-- Container que iguala o tamanho da HQ -->
  <div id="fake-stage">
    <img src="assets/fakeending.gif" alt="Fake Ending">
  </div>
</body>
</html>
